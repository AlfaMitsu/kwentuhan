workflows:
  android-apk:
    name: Kwentuhan Android APK
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      # For a Play Store-ready signed APK, upload a keystore in Codemagic
      # and uncomment the following two lines:
      # android_signing:
      #   - kwentuhan_keystore

    scripts:
      - name: Ensure Flutter platform files
        script: |
          # The checked-in platform folders are included. This fallback lets
          # Codemagic restore the official wrapper metadata if necessary.
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ] || [ ! -d ios/Runner.xcodeproj ]; then
            flutter create --platforms=android,ios .
          fi
      - name: Align Android Gradle toolchain
        script: |
          set -e
          wrapper_props="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$wrapper_props" ]; then
            awk '
              BEGIN { updated = 0 }
              /^distributionUrl=/ {
                print "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-bin.zip"
                updated = 1
                next
              }
              { print }
              END {
                if (!updated) print "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-bin.zip"
              }
            ' "$wrapper_props" > "$wrapper_props.tmp"
            mv "$wrapper_props.tmp" "$wrapper_props"
          fi
          touch android/gradle.properties
          awk '
            BEGIN { new_dsl = 0; built_in_kotlin = 0 }
            /^android.newDsl=/ {
              print "android.newDsl=false"
              new_dsl = 1
              next
            }
            /^android.builtInKotlin=/ {
              print "android.builtInKotlin=false"
              built_in_kotlin = 1
              next
            }
            { print }
            END {
              if (!new_dsl) print "android.newDsl=false"
              if (!built_in_kotlin) print "android.builtInKotlin=false"
            }
          ' android/gradle.properties > android/gradle.properties.tmp
          mv android/gradle.properties.tmp android/gradle.properties
      - name: Install packages
        script: flutter pub get
      - name: Build release APK
        script: flutter build apk --release

    artifacts:
      - build/**/outputs/apk/**/*.apk
